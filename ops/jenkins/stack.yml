services:
  app:
    environment:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
  kafka:
    environment:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
  prometheus:
    image: tern-jenkins-prometheus
    build:
      context: .
      dockerfile: ops/jenkins/Prometheus.Dockerfile
    # The host daemon cannot bind files from the controller's workspace.
    volumes: !reset []
