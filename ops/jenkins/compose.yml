name: pulsegrid-ci
services:
  docker:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ''
    volumes:
      - jenkins_home:/var/jenkins_home
      - docker_data:/var/lib/docker
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ci]
  jenkins:
    build: .
    ports: ['127.0.0.1:8081:8080']
    environment:
      DOCKER_HOST: tcp://docker:2375
      JAVA_OPTS: '-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true'
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../..:/repo:ro
    depends_on:
      docker:
        condition: service_healthy
    networks: [ci]
volumes:
  jenkins_home:
  docker_data:
networks:
  ci:
